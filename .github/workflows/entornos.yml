# Verifica el test real: cada push a `test` lo despliega Coolify (recurso `gc2-test`, mismo compose que prod, base y archivos propios).
# Este workflow espera a que ese deploy termine y corre los E2E contra la URL de test. No necesita token de Coolify ni acceso a la base.
#
# Configuracion (la hace el usuario):
#   Variable del repo: TEST_URL (por ejemplo https://test.gc2entrenamientoderesistencia.com.ar). Sin ella el workflow no hace nada.
# El deploy se detecta por `started_at` de /api/health: se espera un contenedor que haya arrancado despues de que empezo este job.
name: Entornos
on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entornos-test
  cancel-in-progress: true

jobs:
  e2e-test:
    if: ${{ vars.TEST_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'npm' }
      - name: Esperar el deploy de test en Coolify
        env:
          TEST_URL: ${{ vars.TEST_URL }}
          EVENTO: ${{ github.event_name }}
        run: |
          inicio=$(date +%s)
          deadline=$((SECONDS + 900))
          while [ $SECONDS -lt $deadline ]; do
            cuerpo=$(curl -fsS --max-time 10 "$TEST_URL/api/health" 2>/dev/null || true)
            estado=$(echo "$cuerpo" | jq -r '.status // empty' 2>/dev/null || true)
            arranque=$(echo "$cuerpo" | jq -r '.started_at // empty' 2>/dev/null || true)
            if [ "$estado" = "ok" ]; then
              # Disparado a mano no hay deploy nuevo que esperar: alcanza con que responda.
              [ "$EVENTO" = "workflow_dispatch" ] && { echo "Test responde"; exit 0; }
              if [ -n "$arranque" ] && [ "$(date -d "$arranque" +%s)" -ge "$inicio" ]; then echo "Test desplegado (arranque $arranque)"; exit 0; fi
              echo "Test sigue con el contenedor anterior (arranque ${arranque:-desconocido})"
            fi
            sleep 15
          done
          echo "::error::no hubo un deploy nuevo de test en 15 min"; exit 1
      - run: npm ci
      - name: E2E contra test
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          BASE_URL: ${{ vars.TEST_URL }}
      - name: Guardar el reporte si fallo
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
