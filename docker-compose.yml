# Postgres local para la rama dev. test y prod viven en Coolify (docs/environments.md).
# Puerto en el rango de la cuenta (ver /etc/dev-ports.conf); ajustar DEV_DB_PORT si hace falta.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:${DEV_DB_PORT:-42432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
